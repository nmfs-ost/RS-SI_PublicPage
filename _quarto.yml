project:
  type: website

website: 
  page-navigation: true
  title: "NOAA quarto simple" 
  site-url: "https://nmfs-ost.github.io/RS-SI_PublicPage/" 
  repo-url: "https://nmfs-ost.github.io/RS-SI_PublicPage/"
  repo-actions: [none]
  favicon: images/favicon.ico

  page-footer:
    right: "This page is built with [Quarto](https://quarto.org/)."
    left: "&copy; CC-1.0"

  sidebar:
    background: "#D9E3E4"
    logo: "images/RS-SI-logo.png"
    favicon: images/favicon.ico
    pinned: true
    align: center
    tools: 
      - icon: github
        href: https://github.com/nmfs-ost/RS-SI_PublicPage/tree/main
        text: "Source Code"

    style: "docked"
    search: true
    collapse-level: 1
    contents:
      - href: index.qmd
        text: Welcome
      - href: content/WhoWeAre.qmd
        text: Who We Are
      - section: content/RSSIProjects.qmd
        contents: 
          - href: content/EcoCast.qmd
            text: EcoCast
          - href: content/ERDDAP.qmd
            text: ERDDAP
          - href: content/GAIA.qmd
            text: GAIA
          - href: content/CoastalChl.qmd
            text: Coastal Chlorophyll for Fisheries
          - href: content/TSS.qmd
            text: Trophic Structure from Space
          - href: content/GriddedBGC-Argo.qmd
            text: GOBAI
          - href: content/SEA-Fish.qmd
            text: SEA-Fish

format:
  html:
    theme:
      light: [cosmo, theme.scss] 
      dark: [cosmo, theme-dark.scss]
    code-copy: true
    code-overflow: wrap
    toc: true


filters:
  - include-files.lua
  - quarto



